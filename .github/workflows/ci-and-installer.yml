name: CI and Tauri Installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-tests:
    name: Firmware Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run Firmware Unit Tests (native)
        run: pio test -e native --project-dir firmware

      - name: Build Firmware (ATmega32U4)
        run: pio run -e control_pad_32u4 --project-dir firmware

  studio-frontend-tests:
    name: Studio Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Build Frontend
        run: npm run build

  studio-backend-tests:
    name: Studio Backend Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Tests
        run: cargo test --manifest-path studio/src-tauri/Cargo.toml --all-targets

  tauri-installer:
    name: Build Tauri Installer (Windows)
    runs-on: windows-latest
    needs:
      - firmware-tests
      - studio-frontend-tests
      - studio-backend-tests
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri Installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-pad-studio-msi-${{ github.sha }}
          path: studio/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-pad-studio-nsis-${{ github.sha }}
          path: studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
